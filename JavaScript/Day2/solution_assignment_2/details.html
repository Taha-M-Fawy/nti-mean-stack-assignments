<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details Page</title>
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
}

body {
    background-color: #f4f6f8;
    padding: 40px 15px;
    color: #333333;
}

#container {
    max-width: 850px;
    margin: 0 auto;
}
.details-wrapper {
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    border: 1px solid #e5e7eb;
}

.back-link {
    display: inline-flex;
    align-items: center;
    margin-bottom: 20px;
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
    transition: color 0.2s ease;
}

.back-link:hover {
    color: #1d4ed8;
    text-decoration: underline;
}

.main-img {
    width: 100%;
    height: 380px;
    object-fit: contain;
    border-radius: 8px;
    background-color: #fafafa;
    border: 1px solid #f0f0f0;
    margin-bottom: 16px;
    transition: opacity 0.2s ease-in-out;
}

.thumbs-container {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 24px;
}

.thumb-img {
    width: 75px;
    height: 75px;
    object-fit: contain;
    background-color: #fafafa;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.15s ease;
}

.thumb-img:hover,
.thumb-img.active {
    border-color: #2563eb;
    transform: scale(1.05);
}

.product-info h2 {
    font-size: 1.6rem;
    color: #111827;
    margin-bottom: 10px;
}

.product-info .price {
    font-size: 1.4rem;
    font-weight: 700;
    color: #059669;
    margin-bottom: 15px;
}

.product-info .description {
    font-size: 1rem;
    line-height: 1.7;
    color: #4b5563;
}
    </style>
</head>
<body>

    <h1>Details Page</h1>
    <div id="container">

    </div>

    <script>
        var id = location.search.split('=')[1];

        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://dot-net-day6-lab.vercel.app/');
        xhr.send();

        xhr.onload = function () {
            var products = JSON.parse(xhr.response);

            for (var product of products) {
                if (product.id == id) {

                    var allImages = "";
                    for (var img of product.images) {
                        allImages += `<img src="${img}" width="200" style="margin: 10px;">`;
                    }

                    document.getElementById('container').innerHTML = `
                        <h2>${product.name}</h2>
                        <h3>${product.price}</h3>
                        <p>${product.description}</p>
                        <div>${allImages}</div>
                    `;

                    break;
                }
            }
        }
    </script>

</body>

</html>
